# Training schedule (Optimized for 4GB VRAM GPU e.g., RTX 3050)
num_epochs: 8
batch_size: 16
accum_iter: 20
base_lr: 1.0
warmup: 3000

# Model architecture
d_model: 512
d_ff: 2048
num_layers: 6
num_heads: 8
dropout: 0.1
label_smoothing: 0.1

# Data
max_padding: 72
vocab_min_freq: 2
language_pair: ["de", "en"]

# Paths
output_dir: outputs
checkpoint_prefix: multi30k_model_
vocab_path: outputs/vocab.pt
dashboard_path: outputs/dashboard.html
metrics_path: outputs/metrics.json

# Runtime
device: auto
distributed: false
seed: 42

# Evaluation
eval_every_epoch: true
max_decode_len: 72

# MLflow Experiment Tracking
mlflow:
  enabled: true
  experiment_name: "Annotated_Transformer_Multi30k"
  tracking_uri: "sqlite:///mlflow.db"
  log_artifacts: true